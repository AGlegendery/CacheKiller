[package]
name = "cachekiller"
version = "9.0.0"
edition = "2024"
description = "CacheKiller - fast, accurate TUI cache cleaner for Linux and Windows"
license = "MIT"
authors = ["AGlegend"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ratatui = "0.29"
rayon = "1.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
